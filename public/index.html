<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Ferretería</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:1000px;margin:20px auto;padding:0 12px;color:#222}
  h1{margin-bottom:4px} section{border:1px solid #ddd;border-radius:8px;padding:12px;margin:14px 0}
  table{width:100%;border-collapse:collapse} th,td{padding:6px;border-bottom:1px solid #eee;text-align:left}
  .bajo{background:#fff3cd} input,select,button{padding:6px;margin:2px}
  button{cursor:pointer} .stats span{display:inline-block;margin-right:18px}
  #msg{color:#b00020;min-height:1.2em}
</style>
</head>
<body>
<h1>🔧 Sistema de Ferretería</h1>
<div class="stats" id="stats"></div>
<div id="msg"></div>

<section>
  <h2>Productos</h2>
  <input id="q" placeholder="Buscar..." oninput="cargarProductos()">
  <form onsubmit="agregarProducto(event)">
    <input id="n" placeholder="Nombre" required>
    <input id="c" placeholder="Categoría">
    <input id="p" type="number" step="0.01" placeholder="Precio" required>
    <input id="s" type="number" placeholder="Stock" required>
    <button>Agregar</button>
  </form>
  <table><thead><tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
  <tbody id="productos"></tbody></table>
  <small>Las filas amarillas están en o bajo el stock mínimo.</small>
</section>

<section>
  <h2>Nueva venta</h2>
  <select id="vp"></select>
  <input id="vc" type="number" value="1" min="1" style="width:70px">
  <button onclick="agregarLinea()">Agregar al carrito</button>
  <ul id="carrito"></ul>
  <strong>Total: Q<span id="total">0</span></strong>
  <button onclick="cobrar()">Cobrar</button>
</section>

<section>
  <h2>Historial de ventas</h2>
  <table><thead><tr><th>#</th><th>Fecha</th><th>Detalle</th><th>Total</th></tr></thead><tbody id="ventas"></tbody></table>
</section>

<script>
let productos = [], carrito = [];
const api = async (m, u, b) => {
  const r = await fetch('/api' + u, { method: m, headers: {'Content-Type':'application/json'}, body: b ? JSON.stringify(b) : undefined });
  const data = r.status === 204 ? null : await r.json();
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
};
const aviso = t => { document.getElementById('msg').textContent = t || ''; };

async function cargarProductos() {
  const q = document.getElementById('q').value;
  productos = await api('GET', '/productos' + (q ? '?q=' + encodeURIComponent(q) : ''));
  document.getElementById('productos').innerHTML = productos.map(p =>
    `<tr class="${p.stock <= p.stockMinimo ? 'bajo' : ''}"><td>${p.id}</td><td>${p.nombre}</td><td>${p.categoria}</td><td>Q${p.precio}</td><td>${p.stock}</td>
     <td><button onclick="borrar(${p.id})">Eliminar</button></td></tr>`).join('');
  document.getElementById('vp').innerHTML = productos.map(p => `<option value="${p.id}">${p.nombre} (Q${p.precio}, stock ${p.stock})</option>`).join('');
}
async function agregarProducto(e) {
  e.preventDefault();
  try {
    await api('POST', '/productos', { nombre: n.value, categoria: c.value, precio: +p.value, stock: +s.value });
    e.target.reset(); aviso(); refrescar();
  } catch (err) { aviso(err.message); }
}
async function borrar(id) { await api('DELETE', '/productos/' + id); refrescar(); }

function agregarLinea() {
  const id = +document.getElementById('vp').value, cant = +document.getElementById('vc').value;
  const prod = productos.find(x => x.id === id);
  if (prod) { carrito.push({ productoId: id, cantidad: cant, nombre: prod.nombre, precio: prod.precio }); pintarCarrito(); }
}
function pintarCarrito() {
  document.getElementById('carrito').innerHTML = carrito.map(i => `<li>${i.cantidad} × ${i.nombre} = Q${i.cantidad * i.precio}</li>`).join('');
  document.getElementById('total').textContent = carrito.reduce((s, i) => s + i.cantidad * i.precio, 0);
}
async function cobrar() {
  try {
    await api('POST', '/ventas', { items: carrito.map(({ productoId, cantidad }) => ({ productoId, cantidad })) });
    carrito = []; pintarCarrito(); aviso(); refrescar();
  } catch (err) { aviso(err.message); }
}
async function cargarVentas() {
  const v = await api('GET', '/ventas');
  document.getElementById('ventas').innerHTML = v.slice().reverse().map(x =>
    `<tr><td>${x.id}</td><td>${new Date(x.fecha).toLocaleString()}</td><td>${x.items.map(i => i.cantidad + '× ' + i.nombre).join(', ')}</td><td>Q${x.total}</td></tr>`).join('');
}
async function cargarStats() {
  const r = await api('GET', '/reportes/resumen');
  document.getElementById('stats').innerHTML =
    `<span>Ventas: <b>${r.totalVentas}</b></span><span>Ingresos: <b>Q${r.ingresos}</b></span>` +
    `<span>Más vendido: <b>${r.productoMasVendido ? r.productoMasVendido.nombre : '—'}</b></span><span>Bajo stock: <b>${r.productosBajoStock}</b></span>`;
}
function refrescar() { cargarProductos(); cargarVentas(); cargarStats(); }
refrescar();
</script>
</body>
</html>
